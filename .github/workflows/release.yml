name: Release

# 推送 v* tag 时自动打包多平台可执行文件并发布 GitHub Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # Electron 桌面应用：mac dmg/zip + win 安装器/便携版 + linux AppImage
  app:
    name: app-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, args: '--mac' }
          - { os: windows-latest, args: '--win' }
          - { os: ubuntu-22.04, args: '--linux' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build desktop app
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage

  # CLI 单文件：保留终端用法（pkg）
  cli:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 固定 node22.23.4：pkg-fetch v3.6 缓存里五平台 base 二进制齐全，
          # 用 "node22" 这种大版本号会解析到没有预编译二进制的最新版，触发源码编译直接失败
          # darwin-x64 用 arm64 runner 交叉编译：macos-13(Intel) 免费额度排队极长
          - { os: darwin,  arch: arm64, runner: macos-latest, target: node22.23.4-macos-arm64 }
          - { os: darwin,  arch: x64,   runner: macos-latest, target: node22.23.4-macos-x64 }
          - { os: linux,   arch: x64,   runner: ubuntu-22.04, target: node22.23.4-linux-x64 }
          - { os: linux,   arch: arm64, runner: ubuntu-22.04, target: node22.23.4-linux-arm64 }
          - { os: win,     arch: x64,   runner: windows-latest, target: node22.23.4-win-x64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # CLI 构建只要生产依赖（node-forge），跳过 electron / electron-builder
        run: npm install --omit=dev --no-audit --no-fund

      - name: Build single executable (${{ matrix.target }})
        run: npx --yes @yao-pkg/pkg@latest . --targets ${{ matrix.target }} --output dist/ireq

      - name: Package (posix)
        if: runner.os != 'Windows'
        run: |
          # pkg 单 target 时 --output 就是精确文件名（dist/ireq），不带平台后缀
          cd dist
          chmod +x ireq
          cp ireq ireq-${{ matrix.os }}-${{ matrix.arch }}
          tar -czf iReq-${{ matrix.os }}-${{ matrix.arch }}.tar.gz ireq-${{ matrix.os }}-${{ matrix.arch }}
          shasum -a 256 iReq-${{ matrix.os }}-${{ matrix.arch }}.tar.gz > iReq-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256
          # 删掉裸二进制：Release 步骤的 dist/iReq-* 在 macOS 大小写不敏感文件系统上会误匹配 ireq-*
          rm -f ireq ireq-${{ matrix.os }}-${{ matrix.arch }}

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd dist
          # Windows 上 pkg 会自动补 .exe 扩展名
          if (Test-Path ireq.exe) { Move-Item ireq.exe ireq-win-x64.exe } else { Move-Item ireq ireq-win-x64.exe }
          Compress-Archive -Path ireq-win-x64.exe -DestinationPath iReq-win-x64.zip -Force
          $h = (Get-FileHash iReq-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$h  iReq-win-x64.zip" | Out-File -Encoding ascii iReq-win-x64.zip.sha256
          # 删掉裸二进制：Release 的 dist/iReq-* 在大小写不敏感 FS 上会误匹配 ireq-*
          Remove-Item ireq-win-x64.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/iReq-*
