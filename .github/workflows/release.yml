name: Release

# 推送 v* tag 时自动打包多平台可执行文件并发布 GitHub Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # Electron 桌面应用：mac dmg/zip + win 安装器/便携版 + linux AppImage
  app:
    name: app-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, args: '--mac' }
          - { os: windows-latest, args: '--win' }
          - { os: ubuntu-22.04, args: '--linux' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build desktop app
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # 只上传产物，不动 release body：changelog 统一由末尾的 notes job 写一次
          files: |
            release/*.dmg
            release/*.exe
            release/*.AppImage

  # CLI 单文件：保留终端用法（pkg）
  cli:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 固定 node22.23.4：pkg-fetch v3.6 缓存里五平台 base 二进制齐全，
          # 用 "node22" 这种大版本号会解析到没有预编译二进制的最新版，触发源码编译直接失败
          # darwin-x64 用 arm64 runner 交叉编译：macos-13(Intel) 免费额度排队极长
          - { os: darwin,  arch: arm64, runner: macos-latest, target: node22.23.4-macos-arm64 }
          - { os: darwin,  arch: x64,   runner: macos-latest, target: node22.23.4-macos-x64 }
          - { os: linux,   arch: x64,   runner: ubuntu-22.04, target: node22.23.4-linux-x64 }
          - { os: linux,   arch: arm64, runner: ubuntu-22.04, target: node22.23.4-linux-arm64 }
          - { os: win,     arch: x64,   runner: windows-latest, target: node22.23.4-win-x64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # CLI 构建只要生产依赖（node-forge），跳过 electron / electron-builder
        run: npm install --omit=dev --no-audit --no-fund

      - name: Build single executable (${{ matrix.target }})
        run: npx --yes @yao-pkg/pkg@latest . --targets ${{ matrix.target }} --output dist/ireq

      - name: Package (posix)
        if: runner.os != 'Windows'
        run: |
          # pkg 单 target 时 --output 就是精确文件名（dist/ireq），不带平台后缀
          cd dist
          chmod +x ireq
          cp ireq ireq-${{ matrix.os }}-${{ matrix.arch }}
          tar -czf iReq-${{ matrix.os }}-${{ matrix.arch }}.tar.gz ireq-${{ matrix.os }}-${{ matrix.arch }}
          shasum -a 256 iReq-${{ matrix.os }}-${{ matrix.arch }}.tar.gz > iReq-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256
          # 删掉裸二进制：Release 步骤的 dist/iReq-* 在 macOS 大小写不敏感文件系统上会误匹配 ireq-*
          rm -f ireq ireq-${{ matrix.os }}-${{ matrix.arch }}

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd dist
          # Windows 上 pkg 会自动补 .exe 扩展名
          if (Test-Path ireq.exe) { Move-Item ireq.exe ireq-win-x64.exe } else { Move-Item ireq ireq-win-x64.exe }
          Compress-Archive -Path ireq-win-x64.exe -DestinationPath iReq-win-x64.zip -Force
          $h = (Get-FileHash iReq-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$h  iReq-win-x64.zip" | Out-File -Encoding ascii iReq-win-x64.zip.sha256
          # 删掉裸二进制：Release 的 dist/iReq-* 在大小写不敏感 FS 上会误匹配 ireq-*
          Remove-Item ireq-win-x64.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # 只上传产物，不动 release body：changelog 统一由末尾的 notes job 写一次
          files: dist/iReq-*

  # Changelog 只写一次：8 个构建 job 并发上传产物，每个都 generate_release_notes
  # 会把自动生成的 changelog 反复追加到同一个 release（历史上重复 7~8 行）。
  # 改由本 job 等全部构建结束后，把 annotated tag 的 message（本次增量）写一次。
  notes:
    name: release-notes
    needs: [app, cli]
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write changelog once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          # checkout 在 tag push 上会把 annotated tag 解引用成 lightweight tag，
          # 此时 git for-each-ref %(contents) 取到的是 commit message 而非 tag 说明。
          # 直接读 GitHub API 的 tag object，才能拿到发版时写进 tag 的 changelog。
          REF_TYPE="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.type')"
          REF_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha')"
          if [ "$REF_TYPE" = "tag" ]; then
            MSG="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${REF_SHA}" --jq '.message')"
          else
            MSG=""
          fi
          NOTES="$(mktemp)"
          if [ -n "$(printf '%s' "$MSG" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$MSG" > "$NOTES"
          else
            printf 'Release %s\n' "$TAG" > "$NOTES"
          fi
          if [ -n "$PREV" ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$PREV" "$TAG" >> "$NOTES"
          else
            printf '\n**Full Changelog**: https://github.com/%s/commits/%s\n' \
              "$GITHUB_REPOSITORY" "$TAG" >> "$NOTES"
          fi
          # 构建 job 已经创建 release；这里只覆盖 body 一次，绝不追加
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES" --verify-tag
          fi
