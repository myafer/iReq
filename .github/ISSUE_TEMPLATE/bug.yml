name: Bug 报告
description: 解不开、列表空的、界面不对、崩溃 —— 任何「应该正常但没正常」的情况
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        谢谢反馈。填得越具体，修得越快。

        > 如果问题涉及**公司内网 / 私人账号的流量内容**，不用贴报文：把版本、平台、失败域名和截图给我就够了。

  - type: input
    id: version
    attributes:
      label: iReq 版本
      description: 顶栏右上角「更多 ⋯」→ 设置，底部能看到；或看安装包文件名
      placeholder: 例：1.3.7
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 运行平台
      options:
        - macOS（Apple Silicon）
        - macOS（Intel）
        - Windows
        - Linux
        - 源码运行（node / npm start）
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 出问题的环节
      multiple: true
      options:
        - HTTPS 解不开 / 列表里是「安全透传」
        - 列表没有流量 / 一直是空的
        - 浏览器或 App 报证书错误
        - HTTP/2 相关
        - Mock 规则不生效
        - 断网 / 弱网模拟
        - 导出、搜索、筛选
        - 界面错位 / 显示异常
        - 崩溃 / 无法启动
        - 其他
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 你看到的现象，和列表里那一行是什么（域名、方法、状态码）
      placeholder: |
        例：抓 gsa-gpk.apple.com 时列表顶部出现一条红色诊断行，
        点开显示「TLS 握手失败（客户端可能不信任证书）」，ALPN 是 not negotiated。
    validations:
      required: true

  - type: textarea
    id: expect
    attributes:
      label: 你期望的结果
      placeholder: 例：应该能解密看到请求内容
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按 1 / 2 / 3 写，越短越好
      placeholder: |
        1. 打开 iReq，确认系统代理已接管
        2. 在 App 里触发一次该请求
        3. 看列表顶部
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 截图 / 补充信息（可选）
      description: 可以直接把截图拖进来。**不要贴真实的 Cookie、Token、手机号等敏感内容**
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我看过 README 的「排障」章节，问题不在那里
        - label: 我搜过现有 issue，没有重复
          required: true
